          application/json:
            schema: { $ref: '#/components/schemas/ConductorCrear' }
      responses:
        '201':
          description: Conductor creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conductor' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /conductores/{conductorId}:
    put:
      tags: [Operación]
      operationId: editarConductor
