openapi: 3.0.3
info:
  title: BusetasApp API (prototipo)
  version: 0.1.0-propuesto
  description: |
    Contrato REST propuesto para el backend de BusetasApp (Actividad 6).
    **Estado: PROPUESTO.** Confirmado por el equipo solo que la base de datos es Supabase.

    Convenciones
    - Prefijo `/api/v1`. JSON UTF-8. Fechas ISO 8601 con zona. Horas locales `HH:MM` (zona `America/Bogota`).
    - Coordenadas `lat` y `lng` (WGS84, grados decimales). Geometrías GeoJSON con orden `[lng, lat]`.
    - Los endpoints sin candado no exigen cuenta (BR-01).
    - Toda escritura sobre un recurso existente exige `version`; si no coincide, `409 CONFLICTO_VERSION` (RNF-02).
    - Cada respuesta incluye la cabecera `X-Id-Peticion`.
    - Rutas compartidas: una ruta tiene uno o más *servicios* (uno por empresa) con horario y frecuencia propios.
  contact:
    name: Equipo BusetasApp
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
  - url: https://{host}/api/v1
    description: Hosting del prototipo (por decidir)
    variables:
      host:
        default: por-definir.example
tags:
  - name: Red
    description: Rutas, paraderos, hitos (M-01, M-05)
  - name: Horarios
    description: Horarios, frecuencias y festivos (M-02)
  - name: Seguimiento
    description: Busetas en vivo, ETA e ingesta de posiciones (M-03)
  - name: Planificación
    description: Planificación de viaje (M-04)
  - name: Pasajero
    description: Favoritos, alertas, notificaciones (M-06)
  - name: Operación
    description: Jefe de operaciones (M-07)
  - name: Secretaría
    description: Secretaría de Movilidad (M-01)
  - name: Avisos
    description: Avisos (M-08)
  - name: Estadísticas
    description: Estadísticas de uso (M-09)
  - name: Administración
    description: Administrador (M-10)
  - name: Sistema
    description: Salud
paths:
  /salud:
    get:
      tags: [Sistema]
      operationId: consultarSalud
      summary: Estado del servicio (también sirve para evitar el arranque en frío)
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado: { type: string, enum: [ok] }

  # ------------------------------------------------------------------ Red (público)
  /rutas/cercanas:
    get:
      tags: [Red]
      operationId: consultarRutasCercanas
      summary: Rutas y paraderos cercanos a un punto (HU-P01, RF-001-01)
      description: |
        Sin rutas dentro del radio devuelve `rutas: []` y `paraderoMasCercano` (flujo alternativo de HU-P01).
        Si se envía `rutaId`, `paraderoMasCercano` es el más cercano **a esa ruta**.
      parameters:
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lng'
        - name: radioM
          in: query
          schema: { type: integer, minimum: 50, maximum: 5000 }
          description: Por defecto el parámetro `radio_busqueda_m`
        - name: rutaId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rutas y paraderos cercanos
          content:
            application/json:
              schema:
                type: object
                required: [rutas, paraderos]
                properties:
                  rutas:
                    type: array
                    items: { $ref: '#/components/schemas/RutaResumen' }
                  paraderos:
                    type: array
                    items: { $ref: '#/components/schemas/ParaderoCercano' }
                  paraderoMasCercano:
                    allOf:
                      - $ref: '#/components/schemas/ParaderoCercano'
                    nullable: true
        '400': { $ref: '#/components/responses/Validacion' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /rutas/{rutaId}:
    parameters:
      - $ref: '#/components/parameters/rutaId'
    get:
      tags: [Red]
      operationId: obtenerDetalleRuta
      summary: Recorrido, paraderos y servicios de una ruta (HU-P02, RF-001-02)
      description: |
        Si la ruta no existe devuelve 404; el cliente llama entonces a `consultarRutasCercanas` con el destino (flujo alternativo).
      responses:
        '200':
          description: Detalle de la ruta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RutaDetalle' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    put:
      tags: [Secretaría]
      operationId: editarRuta
      summary: Editar una ruta (HU-SM02, RF-007-02)
      security: [{ bearerAuth: [] }]
      description: Rol `secretaria_movilidad` o `administrador`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RutaEditar' }
      responses:
        '200':
          description: Ruta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RutaDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
    delete:
      tags: [Secretaría]
      operationId: eliminarRuta
      summary: Dar de baja una ruta (HU-SM03, RF-007-03)
      security: [{ bearerAuth: [] }]
      description: |
        Baja lógica. Con asignaciones vigentes y sin `confirmar=true` responde `409 CONFLICTO_NEGOCIO` con la lista (flujo alternativo).
        Al confirmar: se cierran las asignaciones y se cancelan los turnos futuros.
      parameters:
        - name: confirmar
          in: query
          schema: { type: boolean, default: false }
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Ruta dada de baja }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Asignaciones vigentes (CONFLICTO_NEGOCIO) o versión distinta (CONFLICTO_VERSION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /rutas:
    post:
      tags: [Secretaría]
      operationId: registrarRuta
      summary: Registrar una ruta y asignarla a una o más empresas (HU-SM01, RF-007-01)
      security: [{ bearerAuth: [] }]
      description: |
        Si alguna empresa ya opera una ruta equivalente y no viene `confirmarCompartida=true`, responde
        `409 CONFLICTO_NEGOCIO` ("pide verificar"). Con la confirmación se crea el servicio adicional (ruta compartida).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RutaCrear' }
      responses:
        '201':
          description: Ruta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RutaDetalle' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /rutas/{rutaId}/servicios:
    parameters:
      - $ref: '#/components/parameters/rutaId'
    post:
      tags: [Secretaría]
      operationId: asignarRutaAEmpresa
      summary: Asignar una ruta existente a otra empresa (BR-04)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioCrear' }
      responses:
        '201':
          description: Servicio creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicioRuta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /servicios/{servicioId}:
    parameters:
      - $ref: '#/components/parameters/servicioId'
    put:
      tags: [Secretaría]
      operationId: editarServicioRuta
      summary: Editar código público, estado o duración de un servicio (Secretaría)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioEditar' }
      responses:
        '200':
          description: Servicio actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicioRuta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    delete:
      tags: [Secretaría]
      operationId: retirarRutaDeEmpresa
      summary: Retirar la ruta a una empresa (baja del servicio)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: confirmar
          in: query
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Servicio dado de baja }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /servicios/{servicioId}/datos-operativos:
    parameters:
      - $ref: '#/components/parameters/servicioId'
    put:
      tags: [Operación]
      operationId: actualizarDatosOperativosServicio
      summary: El jefe edita el código interno y la duración estándar de su servicio (HU-J02)
      security: [{ bearerAuth: [] }]
      description: |
        BR-03: el jefe no edita rutas ni paraderos. Solo estos datos operativos de **su** servicio.
        Un servicio de otra empresa responde 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                codigoInterno: { type: string, maxLength: 20, nullable: true }
                duracionEstandarMin: { type: integer, minimum: 5, maximum: 300, nullable: true }
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Servicio actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicioRuta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /paraderos/cercanos:
    get:
      tags: [Red]
      operationId: consultarParaderosCercanos
      summary: Paraderos cercanos a un punto (HU-P01 alternativo)
      parameters:
        - $ref: '#/components/parameters/lat'
        - $ref: '#/components/parameters/lng'
        - name: radioM
          in: query
          schema: { type: integer, minimum: 50, maximum: 5000 }
        - name: rutaId
          in: query
          schema: { type: string, format: uuid }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paraderos ordenados por distancia
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ParaderoCercano' }
        '400': { $ref: '#/components/responses/Validacion' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /paraderos:
    post:
      tags: [Secretaría]
      operationId: crearParadero
      summary: Crear un paradero (HU-SM04, RF-007-04)
      security: [{ bearerAuth: [] }]
      description: Un paradero con el mismo nombre a menos de 20 m responde `409 CONFLICTO_NEGOCIO` (duplicado).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParaderoCrear' }
      responses:
        '201':
          description: Paradero creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paradero' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /paraderos/{paraderoId}:
    parameters:
      - $ref: '#/components/parameters/paraderoId'
    put:
      tags: [Secretaría]
      operationId: editarParadero
      summary: Editar un paradero (HU-SM04)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParaderoEditar' }
      responses:
        '200':
          description: Paradero actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Paradero' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
    delete:
      tags: [Secretaría]
      operationId: eliminarParadero
      summary: Dar de baja un paradero (HU-SM04)
      security: [{ bearerAuth: [] }]
      description: Si lo usan rutas activas y no viene `confirmar=true`, responde 409 con las rutas afectadas.
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: confirmar
          in: query
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Paradero dado de baja }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /hitos:
    post:
      tags: [Secretaría]
      operationId: crearHito
      summary: Crear un hito o barrio de búsqueda [PROPUESTO, no está en las HU]
      security: [{ bearerAuth: [] }]
      description: Rol `secretaria_movilidad` o `administrador`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HitoCrear' }
      responses:
        '201':
          description: Hito creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hito' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
  /empresas:
    get:
      tags: [Red]
      operationId: listarEmpresas
      summary: Empresas activas (para filtros y para que la Secretaría asigne rutas)
      responses:
        '200':
          description: Empresas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empresa' }

  # ------------------------------------------------------------------ Búsqueda (público)
  /busqueda/rutas:
    get:
      tags: [Red]
      operationId: buscarRutasPorTexto
      summary: Buscar rutas por número o nombre (HU-P08, RF-005-01)
      description: Busca por nombre, código público y código interno, sin distinguir tildes ni mayúsculas. Sin coincidencias devuelve `[]`.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '200':
          description: Coincidencias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RutaResumen' }
        '400': { $ref: '#/components/responses/Validacion' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /busqueda/hitos:
    get:
      tags: [Red]
      operationId: buscarHitos
      summary: Buscar hitos, barrios o sectores (HU-P09, RF-005-02)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 60 }
        - name: tipo
          in: query
          schema: { $ref: '#/components/schemas/TipoHito' }
      responses:
        '200':
          description: Hitos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Hito' }
        '400': { $ref: '#/components/responses/Validacion' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /hitos/{hitoId}/rutas:
    get:
      tags: [Red]
      operationId: consultarRutasPorHito
      summary: Rutas que pasan por un hito (HU-P09)
      description: 'Sin rutas devuelve la lista vacía, cobertura en falso y el paradero más cercano (`paraderoMasCercano`).'
      parameters:
        - name: hitoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Rutas del hito
          content:
            application/json:
              schema:
                type: object
                required: [rutas, cobertura]
                properties:
                  cobertura: { type: boolean }
                  rutas:
                    type: array
                    items: { $ref: '#/components/schemas/RutaResumen' }
                  paraderoMasCercano:
                    allOf:
                      - $ref: '#/components/schemas/ParaderoCercano'
                    nullable: true
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  # ------------------------------------------------------------------ Horarios
  /rutas/{rutaId}/horarios:
    parameters:
      - $ref: '#/components/parameters/rutaId'
    get:
      tags: [Horarios]
      operationId: consultarHorarios
      summary: Horarios por empresa y tipo de día (HU-P03, RF-002-01)
      description: |
        Devuelve un elemento por servicio. Un servicio sin horarios llega con `estado: pendiente_actualizacion`.
        Cada tipo de día faltante se omite de `horarios` y se lista en `tiposDiaPendientes`.
      parameters:
        - $ref: '#/components/parameters/empresaIdOpcional'
      responses:
        '200':
          description: Horarios
          content:
            application/json:
              schema:
                type: object
                required: [servicios, tipoDiaHoy]
                properties:
                  tipoDiaHoy: { $ref: '#/components/schemas/TipoDia' }
                  servicios:
                    type: array
                    items: { $ref: '#/components/schemas/HorariosDeServicio' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /rutas/{rutaId}/frecuencias:
    parameters:
      - $ref: '#/components/parameters/rutaId'
    get:
      tags: [Horarios]
      operationId: consultarFrecuencias
      summary: Frecuencia por franja horaria (HU-P04, RF-002-02)
      description: Si `minutosMin` es distinto de `minutosMax`, la interfaz muestra un rango.
      parameters:
        - $ref: '#/components/parameters/empresaIdOpcional'
      responses:
        '200':
          description: Frecuencias
          content:
            application/json:
              schema:
                type: object
                required: [servicios]
                properties:
                  servicios:
                    type: array
                    items: { $ref: '#/components/schemas/FrecuenciasDeServicio' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /servicios/{servicioId}/horarios:
    parameters:
      - $ref: '#/components/parameters/servicioId'
    put:
      tags: [Operación]
      operationId: actualizarHorariosServicio
      summary: El jefe reemplaza los horarios de su servicio (HU-J02, RF-006-02)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HorariosActualizar' }
      responses:
        '200':
          description: Horarios guardados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HorariosDeServicio' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /servicios/{servicioId}/frecuencias:
    parameters:
      - $ref: '#/components/parameters/servicioId'
    put:
      tags: [Operación]
      operationId: actualizarFrecuenciasServicio
      summary: El jefe reemplaza las frecuencias de su servicio (HU-J02)
      security: [{ bearerAuth: [] }]
      description: Franjas solapadas o con `minutosMin > minutosMax` responden 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FrecuenciasActualizar' }
      responses:
        '200':
          description: Frecuencias guardadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FrecuenciasDeServicio' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /festivos:
    get:
      tags: [Horarios]
      operationId: listarFestivos
      summary: Calendario de festivos [SUPUESTO S-14]
      parameters:
        - name: anio
          in: query
          schema: { type: integer, minimum: 2024, maximum: 2100 }
      responses:
        '200':
          description: Festivos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Festivo' }
    post:
      tags: [Administración]
      operationId: crearFestivo
      summary: Registrar un festivo (administrador)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Festivo' }
      responses:
        '201':
          description: Festivo registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Festivo' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ------------------------------------------------------------------ Seguimiento
  /rutas/{rutaId}/busetas:
    parameters:
      - $ref: '#/components/parameters/rutaId'
    get:
      tags: [Seguimiento]
      operationId: consultarBusetasEnVivo
      summary: Busetas en servicio de una ruta (HU-P05, RF-003-01)
      description: |
        Solo busetas con turno vigente en la ruta. Una posición más vieja que `umbral_posicion_obsoleta_s` llega con
        `estado: sin_senal`. Sin unidades, `busetas: []` y `unidadesEnServicio: 0`.
        Si no hay fuente de posiciones, `seguimientoDisponible: false`.
      parameters:
        - $ref: '#/components/parameters/empresaIdOpcional'
        - name: sentido
          in: query
          schema: { $ref: '#/components/schemas/Sentido' }
      responses:
        '200':
          description: Busetas
          content:
            application/json:
              schema:
                type: object
                required: [busetas, unidadesEnServicio, seguimientoDisponible, calculadoEn]
                properties:
                  seguimientoDisponible: { type: boolean }
                  unidadesEnServicio: { type: integer, minimum: 0 }
                  calculadoEn: { type: string, format: date-time }
                  busetas:
                    type: array
                    items: { $ref: '#/components/schemas/BusetaEnVivo' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /paraderos/{paraderoId}/eta:
    parameters:
      - $ref: '#/components/parameters/paraderoId'
    get:
      tags: [Seguimiento]
      operationId: calcularEtaParadero
      summary: Tiempo estimado de llegada a un paradero (HU-P06, RF-003-02)
      description: |
        `fuente`: `gps` (hay buseta con posición fresca), `horario` (respaldo por frecuencia; devuelve rango) o
        `no_disponible` (fuera de horario o sin frecuencia). Un fallo interno responde 503 con `reintentable: true`.
      parameters:
        - name: rutaId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: sentido
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Sentido' }
        - $ref: '#/components/parameters/empresaIdOpcional'
      responses:
        '200':
          description: ETA por servicio
          content:
            application/json:
              schema:
                type: object
                required: [etas, calculadoEn]
                properties:
                  calculadoEn: { type: string, format: date-time }
                  etas:
                    type: array
                    items: { $ref: '#/components/schemas/Eta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /ingesta/posiciones:
    post:
      tags: [Seguimiento]
      operationId: registrarPosiciones
      summary: Recibir posiciones desde el sistema GPS de una empresa o el simulador [SUPUESTO S-01]
      security: [{ claveFuente: [] }]
      description: |
        Lote de hasta 100 posiciones. La empresa sale de la clave; la ruta se deduce del rodamiento publicado.
        Una posición con `reportadaEn` anterior a la guardada se descarta. Límite: un lote cada 2 s por clave.
        Una buseta sin turno vigente se guarda sin ruta (no aparece en mapas de ruta).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LotePosiciones' }
      responses:
        '202':
          description: Lote procesado (puede incluir rechazos parciales)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoIngesta' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '429': { $ref: '#/components/responses/DemasiadasPeticiones' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  # ------------------------------------------------------------------ Planificación
  /viajes/planificar:
    post:
      tags: [Planificación]
      operationId: planificarViaje
      summary: Planificar un viaje con origen y destino (HU-P07, RF-004-01)
      description: |
        Hasta `max_opciones_viaje` opciones. Si no hay directas, ofrece opciones con un transbordo.
        Sin ninguna opción: `opciones: []`, `motivo` y `paraderoMasCercano`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origen, destino]
              properties:
                origen: { $ref: '#/components/schemas/Lugar' }
                destino: { $ref: '#/components/schemas/Lugar' }
      responses:
        '200':
          description: Opciones
          content:
            application/json:
              schema:
                type: object
                required: [opciones]
                properties:
                  opciones:
                    type: array
                    items: { $ref: '#/components/schemas/OpcionViaje' }
                  motivo:
                    type: string
                    enum: [sin_rutas_cerca_del_origen, sin_rutas_cerca_del_destino, sin_conexion]
                  paraderoMasCercano:
                    allOf:
                      - $ref: '#/components/schemas/ParaderoCercano'
                    nullable: true
        '400': { $ref: '#/components/responses/Validacion' }
        '404':
          description: Hito o texto no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  # ------------------------------------------------------------------ Avisos
  /avisos:
    get:
      tags: [Avisos]
      operationId: consultarAvisosVigentes
      summary: Avisos vigentes de empresa, de movilidad y del aplicativo
      parameters:
        - $ref: '#/components/parameters/empresaIdOpcional'
        - name: rutaId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Avisos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Aviso' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    post:
      tags: [Avisos]
      operationId: publicarAviso
      summary: Publicar un aviso (HU-J05, HU-SM05, HU-A05)
      security: [{ bearerAuth: [] }]
      description: |
        El `origen` se deduce del rol: jefe → `empresa`, Secretaría → `movilidad`, administrador → `aplicativo`.
        Cuerpo vacío o más largo que `longitud_max_aviso` → 400 con el límite. El jefe solo afecta rutas de su empresa.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvisoCrear' }
      responses:
        '201':
          description: Aviso publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aviso' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /avisos/{avisoId}:
    delete:
      tags: [Avisos]
      operationId: retirarAviso
      summary: Retirar un aviso
      security: [{ bearerAuth: [] }]
      parameters:
        - name: avisoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Aviso retirado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ------------------------------------------------------------------ Pasajero
  /favoritos:
    get:
      tags: [Pasajero]
      operationId: listarFavoritos
      summary: Mis favoritos (HU-P10)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Favoritos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Favorito' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Pasajero]
      operationId: agregarFavorito
      summary: Guardar una ruta o un paradero como favorito (HU-P10, RF-008-01)
      security: [{ bearerAuth: [] }]
      description: Sin sesión responde 401 con el mensaje "Inicia sesión para guardar". Un favorito repetido devuelve el existente con 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoritoCrear' }
      responses:
        '200':
          description: Ya existía
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorito' }
        '201':
          description: Favorito creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favorito' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
  /favoritos/{favoritoId}:
    delete:
      tags: [Pasajero]
      operationId: quitarFavorito
      summary: Quitar un favorito
      security: [{ bearerAuth: [] }]
      parameters:
        - name: favoritoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Favorito quitado }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /alertas-llegada:
    get:
      tags: [Pasajero]
      operationId: listarAlertasLlegada
      summary: Mis alertas de llegada
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Alertas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertaLlegada' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Pasajero]
      operationId: crearAlertaLlegada
      summary: Activar una alerta de llegada (HU-P11, RF-009-01)
      security: [{ bearerAuth: [] }]
      description: Si no se envía `distanciaAvisoM` se usa `distancia_aviso_llegada_m`. Una alerta repetida responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertaCrear' }
      responses:
        '201':
          description: Alerta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaLlegada' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /alertas-llegada/{alertaId}:
    delete:
      tags: [Pasajero]
      operationId: eliminarAlertaLlegada
      summary: Desactivar una alerta
      security: [{ bearerAuth: [] }]
      parameters:
        - name: alertaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Alerta desactivada }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /suscripciones-push:
    post:
      tags: [Pasajero]
      operationId: registrarSuscripcionPush
      summary: Registrar el navegador para Web Push [SUPUESTO S-09]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, claves]
              properties:
                endpoint: { type: string, format: uri }
                claves:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        '201': { description: Suscripción registrada }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /notificaciones:
    get:
      tags: [Pasajero]
      operationId: listarNotificaciones
      summary: Bandeja de notificaciones dentro de la app
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/limite'
        - $ref: '#/components/parameters/desplazamiento'
      responses:
        '200':
          description: Notificaciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notificacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /notificaciones/{notificacionId}/leida:
    post:
      tags: [Pasajero]
      operationId: marcarNotificacionLeida
      summary: Marcar una notificación como leída
      security: [{ bearerAuth: [] }]
      parameters:
        - name: notificacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Marcada }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ------------------------------------------------------------------ Operación (jefe)
  /conductores:
    get:
      tags: [Operación]
      operationId: listarConductores
