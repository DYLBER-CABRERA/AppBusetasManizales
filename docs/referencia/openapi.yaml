        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/NoAutorizado' }
    post:
      tags: [Operación]
      operationId: crearConductor
      summary: Registrar un conductor (HU-J02)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
